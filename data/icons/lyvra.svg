<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Lyvra</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D232B"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BEDE5"/>
      <stop offset="1" stop-color="#3DB5AB"/>
    </linearGradient>
    <linearGradient id="play" gradientUnits="userSpaceOnUse" x1="124" y1="98" x2="176" y2="158">
      <stop offset="0" stop-color="#B5F4EE"/>
      <stop offset="1" stop-color="#4CC6BC"/>
    </linearGradient>
    <!-- streaks fade in from the left: motion trailing the play mark -->
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="116" y2="0">
      <stop offset="0" stop-color="#5AD1C8" stop-opacity="0"/>
      <stop offset="1" stop-color="#8FE3DC" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AD1C8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5AD1C8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <ellipse cx="128" cy="128" rx="100" ry="76" fill="url(#glow)"/>
  <rect x="38" y="68" width="180" height="120" rx="24" fill="#0E1216" stroke="url(#frame)" stroke-width="12"/>
  <g stroke="url(#streak)" stroke-width="9" stroke-linecap="round">
    <line x1="80" y1="111" x2="114" y2="111"/>
    <line x1="58" y1="128" x2="114" y2="128"/>
    <line x1="80" y1="145" x2="114" y2="145"/>
  </g>
  <path d="M128 103 L128 153 L171 128 Z" fill="url(#play)" stroke="url(#play)" stroke-width="10" stroke-linejoin="round"/>
</svg>
